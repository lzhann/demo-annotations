<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订单 Demo · 总览</title><link rel="stylesheet" href="example.css"><link rel="stylesheet" href="../demo-notes.css"><script src="example.js" defer></script><script src="../demo-notes.js" defer></script></head><body>
<header><a href="../index.html">组件说明</a><h1>订单 Demo</h1><p>可以点击批注模式，对卡片添加意见；切换 Tab 或范围，备注分别记录。</p></header>
<main><div class="toolbar"><label>范围 <select id="scope"><option>总部</option><option>项目A</option><option>项目B</option></select></label><div class="tabs" role="tablist" aria-label="统计周期"><button role="tab" aria-selected="true" data-note-tab="month">当月</button><button role="tab" aria-selected="false" data-note-tab="year">年累</button></div><button id="rerender" data-note-ignore>重新渲染卡片</button></div>
<div id="cards" class="cards"></div><section class="help" data-note-id="help" data-note-label="验收说明"><h2>试一试</h2><ol><li>在“订单数”卡片添加一条备注，然后刷新。</li><li>退出批注后，小圆标仍在；点击“查看明细”仍正常进入。</li><li>切换“年累”或“项目A”，圆标不会串到新视图。</li><li>在备注汇总点击“定位”，自动恢复到对应范围和 Tab。</li><li>标记已处理后再确认验收，圆标消失，记录仍在汇总中。</li></ol></section></main></body></html>
